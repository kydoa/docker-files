services:
    fmd:
        # Use the prebuilt image
        image: registry.gitlab.com/fmd-foss/fmd-server:0.14.2
        user: "1000:1000"
        ports:
         - "127.0.0.1:8080:8080"
         - "192.168.10.133:8080:8080"
        read_only: true
        cap_drop: [ALL]
        security_opt: [no-new-privileges]
        # Or build the image yourself (note the leading 'v')
        # build: https://gitlab.com/fmd-foss/fmd-server.git#v0.13.0
        container_name: fmd
        volumes:
            - '/opt/fmddata/db/:/var/lib/fmd-server/db/'
            - '/opt/fmddata/config.yml:/etc/fmd-server/config.yml:ro'
        restart: unless-stopped
